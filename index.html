<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avengers Character Search</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>AVENGERS CHARACTER SEARCH</h1>
        </header>
        <main>
            <form id="search-form" onsubmit="return false;">
                <label for="search-input">Search by Full Name or Alias</label>
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="e.g. Captain America or Steve Rogers">
                    <button type="button" id="search-btn">Search</button>
                </div>
            </form>
            <section class="result-section">
                <h2>RESULT</h2>
                <hr>
                <div id="result"></div>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
